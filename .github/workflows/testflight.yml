name: Publish TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional TestFlight release notes
        required: false
        type: string
  workflow_call:
    inputs:
      release_notes:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and upload
    runs-on: macos-15
    environment: testflight
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: net.steinbok.Jeffpardy
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set unique build number
        id: build
        run: |
          build_number="$((1000 + GITHUB_RUN_NUMBER)).${GITHUB_RUN_ATTEMPT}"
          xcrun agvtool new-version -all "$build_number"
          echo "number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Select test simulator
        id: simulator
        run: |
          simulator_id="$(
            xcrun simctl list devices available -j |
              jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid'
          )"
          if [[ -z "$simulator_id" || "$simulator_id" == "null" ]]; then
            echo "No available iPhone simulator was found." >&2
            exit 1
          fi
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          xcodebuild test \
            -project JeffpardyIOS.xcodeproj \
            -scheme JeffpardyIOS \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive app
        run: |
          xcodebuild archive \
            -project JeffpardyIOS.xcodeproj \
            -scheme JeffpardyIOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/JeffpardyIOS.xcarchive" \
            DEVELOPMENT_TEAM=Y7KVX7666P \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="AppStore net.steinbok.Jeffpardy"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/JeffpardyIOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlight" \
            -exportOptionsPlist .github/testflight-export-options.plist

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/TestFlight/JeffpardyIOS.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ inputs.release_notes || format('Automated build {0}', steps.build.outputs.number) }}
          uses-non-exempt-encryption: "false"
          wait-for-processing: "true"

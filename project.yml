name: JeffpardyIOS
options:
  bundleIdPrefix: net.steinbok
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SignalRClient:
    url: https://github.com/dotnet/signalr-client-swift
    from: 1.0.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: Y7KVX7666P
    CODE_SIGN_STYLE: Automatic
targets:
  JeffpardyIOS:
    type: application
    platform: iOS
    sources:
      - JeffpardyIOS
    dependencies:
      - package: SignalRClient
        product: SignalRClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.steinbok.Jeffpardy
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: JeffpardyIOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: Jeffpardy
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Jeffpardy uses the local network to show nearby games you can join.
        NSBluetoothAlwaysUsageDescription: Jeffpardy uses Bluetooth to discover games hosted nearby.
        NSCameraUsageDescription: Jeffpardy uses the camera to scan a host secondary-window QR code.
        NSBonjourServices:
          - _jeffpardy._tcp
        ITSAppUsesNonExemptEncryption: false
        JEFFPARDY_BASE_URL: https://jeffpardy.azurewebsites.net
    entitlements:
      path: JeffpardyIOS/Resources/JeffpardyIOS.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:jeffpardy.azurewebsites.net
  JeffpardyIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - JeffpardyIOSTests
    dependencies:
      - target: JeffpardyIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.steinbok.JeffpardyTests
schemes:
  JeffpardyIOS:
    build:
      targets:
        JeffpardyIOS: all
        JeffpardyIOSTests:
          - test
    test:
      targets:
        - JeffpardyIOSTests

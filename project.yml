name: JeffpardyIOS
options:
  bundleIdPrefix: com.jeffsteinbok
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SignalRClient:
    url: https://github.com/dotnet/signalr-client-swift
    from: 1.0.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  JeffpardyIOS:
    type: application
    platform: iOS
    sources:
      - JeffpardyIOS
    dependencies:
      - package: SignalRClient
        product: SignalRClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffsteinbok.jeffpardy
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: JeffpardyIOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: Jeffpardy
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Jeffpardy uses the local network to show nearby games you can join.
        NSBluetoothAlwaysUsageDescription: Jeffpardy uses Bluetooth to discover games hosted nearby.
        NSBonjourServices:
          - _jeffpardy._tcp
        JEFFPARDY_BASE_URL: https://jeffpardy.azurewebsites.net
  JeffpardyIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - JeffpardyIOSTests
    dependencies:
      - target: JeffpardyIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffsteinbok.jeffpardy.tests
schemes:
  JeffpardyIOS:
    build:
      targets:
        JeffpardyIOS: all
        JeffpardyIOSTests:
          - test
    test:
      targets:
        - JeffpardyIOSTests
